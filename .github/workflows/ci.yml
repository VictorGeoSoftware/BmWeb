name: CI

# Quality gate for BmWeb. Runs on every push to the long-lived branches and on
# every pull request targeting them, so a red suite is visible before merge
# rather than after deploy.
#
# Deployment is handled by Firebase App Hosting off the repo, not from here —
# this workflow only verifies, it never publishes.
on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the Node version the app is developed against locally.
          node-version: '20'
          cache: 'npm'

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync with package.json — a drift `npm install` would
      # silently paper over.
      - name: Install dependencies
        run: npm ci

      # Runs before the tests: a type error is cheaper to read than the runtime
      # failure it would cause, and it covers the files no test imports.
      #
      # NOTE: tsconfig includes `.next/types`, which is generated by `next build`
      # and gitignored. It is absent on a clean checkout, so nothing stale is
      # type-checked here.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test
